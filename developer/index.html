<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LastPlate 개발자 도구</title><link rel="stylesheet" href="/assets/styles/main.css?v=2"><style>pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf1e9;padding:18px;font-size:12px;max-height:650px;overflow:auto}textarea{font-family:monospace}</style></head><body><main><div class="page-heading"><h1>개발자 도구 · 발표 준비</h1><a href="/">업무 화면으로</a></div><p>서버 개발 모드와 개발자 인증으로 보호된 화면입니다. 이곳의 원문 상태는 계획 확정이나 자동 실행을 뜻하지 않습니다.</p><section class="panel"><h2>시연 자료 준비</h2><label>자료 유형<select id="profile"><option value="lh-like">기본 3,000명</option><option value="small-site">600명 · 모델 적용 범위 밖</option><option value="risk-demo">재고·유통기한 위험</option></select></label><label>운영일<input id="day" type="date"></label><button id="load">자료 조회</button><p id="preparation"></p><details><summary>사업장 설정·레시피·가격·정책 / 요청 원문</summary><p>등록 인원·급식 용량·정책 변경을 시험하려면 이 개발자 요청을 수정하세요. 업무 화면의 일별 입력과 구분됩니다.</p><textarea id="request" rows="18" aria-label="개발자 요청 원문"></textarea><button id="run" class="secondary">시험 요청 계산</button></details></section><section class="panel"><h2>실행·모델 관리 조회</h2><label>계획 조회 ID<input id="identity"></label><button id="inspect">실행 원문 조회</button><button id="metrics" class="secondary">모델 관리 지표</button><pre id="response"></pre></section><p id="status" role="status"></p><a href="/docs">API 문서</a></main><script type="module" src="/debug/app.js"></script></body></html>
