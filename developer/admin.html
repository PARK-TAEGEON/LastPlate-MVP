<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LastPlate 사업장 설정</title><link rel="stylesheet" href="/assets/styles/main.css?v=2"></head><body><main><div class="page-heading"><div><p class="eyebrow">SITE SETTINGS</p><h1>사업장 설정</h1></div><a href="/">업무 화면으로</a></div><p class="notice">설정은 새로 준비하는 계획에 적용됩니다. 저장된 계획·운영 결과·열람 기록은 바꾸지 않습니다.</p><label>사업장<select id="admin-site"></select></label><label>자료 조회일<input id="admin-date" type="date"></label><form id="settings-form" class="panel"><h2>등록 인원과 용량</h2><div class="fields"><label>등록 인원 (명)<input id="registered_population" type="number" min="1" max="100000" step="1" required></label><label>급식 용량 (식)<input id="meal_capacity" type="number" min="1" max="100000" step="1" required></label></div><h2>운영 정책</h2><p class="muted">사업장에서 정한 기준을 입력하세요. 이 화면은 영양 기준을 새로 제안하지 않습니다.</p><div class="fields"><label>안전 여유분 (%)<input id="safety_margin_pct" type="number" min="0" max="100" step="any" required></label><label>최소 단백질 (g)<input id="minimum_protein" type="number" min="0" step="any" required></label><label>최소 열량 (kcal)<input id="calorie_min" type="number" min="0" step="any" required></label><label>최대 열량 (kcal)<input id="calorie_max" type="number" min="0" step="any" required></label><label>최대 나트륨 (mg)<input id="sodium_max" type="number" min="0" step="any" required></label><label>알레르기 제한 · 쉼표로 구분<input id="allergy_restriction"></label></div><button id="save-settings" type="submit">사업장 설정 저장</button><p id="admin-status" class="local-status" role="status" tabindex="-1"></p></form><section class="panel"><h2>등록 자료 확인</h2><p class="muted">레시피·영양·가격 자료 교체는 데이터 관리 작업입니다. 일일 업무 폼에서 원문을 편집하지 않습니다.</p><details><summary>레시피 기준량</summary><div id="recipes"></div></details><details><summary>가격 기준</summary><div id="prices"></div></details></section><p><a href="/debug">개발자 원문·모델 관리</a></p></main><script type="module" src="/admin/app.js"></script></body></html>
