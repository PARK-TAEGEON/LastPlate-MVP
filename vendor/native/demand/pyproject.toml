[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastplate-ml"
version = "0.2.0"
description = "Standalone LH lunch-demand baseline and guarded batch retraining"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "lightgbm>=4.5,<5", "xgboost>=2.1,<4", "joblib>=1.4,<2", "filelock>=3.16,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
explain = ["shap>=0.46"]
service = ["streamlit>=1.40", "langgraph>=1.0"]

[tool.setuptools.packages.find]
include = ["ml*", "tools*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
