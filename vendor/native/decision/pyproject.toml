[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lastplate-decision"
version = "0.1.3"
description = "Deterministic recommendation and human approval layer for LastPlate"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "langgraph>=1.0,<2"]

[tool.setuptools.packages.find]
include = ["lastplate_decision*"]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
[tool.setuptools.package-data]
lastplate_decision = ["schemas/json/*.json"]
